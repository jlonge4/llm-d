apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/modelserver/base/single-host/default

namePrefix: optimized-baseline-neuron-vllm-

components:
  - ../../../../../recipes/modelserver/components/images/neuron-vllm/release
  - ../../../../../recipes/modelserver/components/graceful-shutdown

labels:
  - pairs:
      llm-d.ai/guide: optimized-baseline
      llm-d.ai/model: Llama-3.1-8B-Instruct
      llm-d.ai/accelerator-variant: neuron
      llm-d.ai/accelerator-vendor: aws
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-vllm.yaml
