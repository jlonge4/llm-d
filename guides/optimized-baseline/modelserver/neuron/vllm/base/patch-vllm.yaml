apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  # Two independent DP=1 servers behind the router. vllm-neuron's own docs
  # recommend this over one server with --data-parallel-size>1, whose
  # load balancing does not scale throughput on Neuron.
  replicas: 2
  # Matches the startupProbe budget below. Left at the 600s default, a first
  # compile still running inside its budget trips ProgressDeadlineExceeded at
  # ten minutes and the rollout reports degraded.
  progressDeadlineSeconds: 7215
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: trn2.48xlarge
      tolerations:
        # EKS Neuron node groups are commonly tainted so only Neuron workloads
        # land on them. Harmless where the taint is absent.
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
      containers:
        - name: modelserver
          # The Neuron device plugin passes the allocated cores in
          # NEURON_RT_VISIBLE_CORES, which vllm-neuron rejects when TP>1 runs
          # worker processes. It reads the same core list from
          # NEURON_VISIBLE_DEVICES, so move it there. The args below become "$@".
          command:
            - /bin/bash
            - -c
            - |
              if [ -n "${NEURON_RT_VISIBLE_CORES:-}" ]; then
                export NEURON_VISIBLE_DEVICES="${NEURON_RT_VISIBLE_CORES}"
                unset NEURON_RT_VISIBLE_CORES
              fi
              exec vllm serve "$@"
            - vllm-serve
          # Include all args in overlay patch for consistency
          args:
            - "meta-llama/Llama-3.1-8B-Instruct"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=8"
            - "--max-model-len=8192"
            - "--max-num-batched-tokens=8192"
            - "--max-num-seqs=8"
            # Prefix caching is on by default in vllm-neuron, but Neuron sizes
            # the KV cache from an explicit block count, so the router's prefix
            # affinity only pays off when the count leaves room to retain
            # prefixes. 8 seqs x 8192 / 128 = 512 blocks are needed to serve at
            # all; 1024 keeps as many again resident for reuse.
            - "--block-size=128"
            - "--num-gpu-blocks-override=1024"
            - "--additional-config"
            - '{"neuron_config": {"kv_segment_size_buckets": [8192], "num_batched_tokens_buckets": [8192], "num_seqs_buckets": [8]}}'
            # Drain in-flight requests on SIGTERM. Sized with the grace period in
            # recipes/modelserver/components/graceful-shutdown; raise both together.
            - "--shutdown-timeout=45"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            # Neuron compile cache (NEFFs). First start compiles; later starts
            # on a warm cache skip it.
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm
            # Unreachable in practice: the startupProbe budget below is 7215s.
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "7200"
            - name: VLLM_NEURON_COMPILATION_TIMEOUT
              value: "2400"
          resources:
            # One logical NeuronCore per TP rank. The Neuron device plugin passes
            # the allocated cores in NEURON_RT_VISIBLE_CORES, which the command
            # above hands to vllm-neuron. Check the advertised count with
            #   kubectl describe node <trn2-node> | grep aws.amazon.com/neuroncore
            # (64 on a trn2.48xlarge at the default LNC=2) and keep it equal to
            # --tensor-parallel-size.
            limits:
              cpu: "16"
              memory: 128Gi
              aws.amazon.com/neuroncore: "8"
            requests:
              cpu: "16"
              memory: 128Gi
              aws.amazon.com/neuroncore: "8"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /var/cache/vllm
              name: neuron-compile-cache
          # 15 + 30x240 = 7215s. A cold Neuron compile plus the weight download
          # runs well past the 3615s the GPU overlays allow, and the cache below
          # is an emptyDir, so a restarted pod pays the compile again.
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 240
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        # Swap for a hostPath on the instance-store NVMe (or a shared PVC) to
        # keep compiled NEFFs across pod restarts.
        - name: neuron-compile-cache
          emptyDir: {}
