apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 2
  # Matches the startupProbe budget below, so a first compile inside its budget
  # does not trip ProgressDeadlineExceeded at the 600s default.
  progressDeadlineSeconds: 7215
  template:
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: trn2.48xlarge
      tolerations:
        # EKS Neuron node groups are commonly tainted so only Neuron workloads
        # land on them. Harmless where the taint is absent.
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
      containers:
        - name: modelserver
          # The Neuron device plugin passes the allocated cores in
          # NEURON_RT_VISIBLE_CORES, which vllm-neuron rejects when TP>1 runs
          # worker processes. It reads the same core list from
          # NEURON_VISIBLE_DEVICES, so move it there. The args below become "$@".
          command:
            - /bin/bash
            - -c
            - |
              if [ -n "${NEURON_RT_VISIBLE_CORES:-}" ]; then
                export NEURON_VISIBLE_DEVICES="${NEURON_RT_VISIBLE_CORES}"
                unset NEURON_RT_VISIBLE_CORES
              fi
              exec vllm serve "$@"
            - vllm-serve
          # The router layers router/precise-prefix-cache-routing.neuron.values.yaml,
          # whose token-producer modelName and blockSizeTokens must match the
          # model and --block-size here.
          args:
            - "meta-llama/Llama-3.1-8B-Instruct"
            # No --enable-scale-out: vLLM 0.24 (this image) mounts the
            # /v1/*/render routes the token-producer calls by default; the flag
            # only exists from vLLM 0.30.
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models,/v1/completions/render,/v1/chat/completions/render"
            - "--disable-hybrid-kv-cache-manager"
            - "--tensor-parallel-size=8"
            - "--max-model-len=8192"
            - "--max-num-batched-tokens=8192"
            - "--max-num-seqs=8"
            # Neuron sizes the KV cache from an explicit block count. 8 seqs x
            # 8192 / 128 = 512 blocks to serve; 1024 keeps as many again
            # resident, which is what the KV events report to the router.
            - "--block-size=128"
            - "--num-gpu-blocks-override=1024"
            - "--additional-config"
            - '{"neuron_config": {"kv_segment_size_buckets": [8192], "num_batched_tokens_buckets": [8192], "num_seqs_buckets": [8]}}'
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","replay_endpoint":"$(KV_EVENTS_REPLAY_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@meta-llama/Llama-3.1-8B-Instruct"}'
            # Drain in-flight requests on SIGTERM. Sized with the grace period in
            # recipes/modelserver/components/graceful-shutdown; raise both together.
            - "--shutdown-timeout=45"
          ports:
            # Exposed so each router replica can dial the per-pod ZMQ
            # socket bound by vLLM (KV_EVENTS_ENDPOINT=tcp://*:5556).
            - containerPort: 5556
              name: kv-events
              protocol: TCP
            - containerPort: 5559
              name: kv-replay
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_PORT
              value: "8000"
            # Pod-discovery mode: vLLM PUBs bind per-pod so every router
            # replica can dial each pod's socket independently.
            - name: KV_EVENTS_ENDPOINT
              value: "tcp://*:5556"
            # Replay buffer: the router asks for buffered events here on connect
            # and after a sequence gap (podDiscoveryConfig.replaySocketPort).
            - name: KV_EVENTS_REPLAY_ENDPOINT
              value: "tcp://*:5559"
            # Neuron compile cache (NEFFs).
            - name: VLLM_CACHE_ROOT
              value: /var/cache/vllm
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "7200"
            - name: VLLM_NEURON_COMPILATION_TIMEOUT
              value: "2400"
          resources:
            # One logical NeuronCore per TP rank (64 per trn2.48xlarge at the
            # default LNC=2); keep equal to --tensor-parallel-size.
            limits:
              cpu: "16"
              memory: 128Gi
              aws.amazon.com/neuroncore: "8"
            requests:
              cpu: "16"
              memory: 128Gi
              aws.amazon.com/neuroncore: "8"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /var/cache/vllm
              name: neuron-compile-cache
          # 15 + 30x240 = 7215s: room for a cold Neuron compile plus the
          # weight download.
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 240
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        # Swap for a hostPath on the instance-store NVMe (or a shared PVC) to
        # keep compiled NEFFs across pod restarts.
        - name: neuron-compile-cache
          emptyDir: {}
