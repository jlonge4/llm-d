apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# AWS Neuron vLLM Inference DLC: vLLM 0.24.0 with the vllm-neuron 0.24.0.1.1.0
# plugin on Neuron SDK 2.32.0 (Trn2, Trn3). Published by AWS on public ECR; see
# https://github.com/aws-neuron/deep-learning-containers#vllm-inference-neuronx
#
# Enough for aggregated serving. NIXL's LIBFABRIC backend, used for P/D over EFA,
# also needs libcuda.so.1 (a stub is fine) and libfabric.so.1 on the loader path.
# If this image lacks either, use ../aws-efa/release, built from
# docker/Dockerfile.neuron.
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx
    newTag: 0.24.0.1.1.0-neuronx-py313-sdk2.32.0-ubuntu24.04

# Workaround for https://github.com/vllm-project/vllm/issues/44548, required with vLLM v0.20.0+ due to torch 2.11-2.13
# This image pins vLLM 0.24.0 on torch 2.11.0, so it is in range.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
  - target:
      kind: LeaderWorkerSet
    patch: |-
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
  - target:
      kind: DisaggregatedSet
    patch: |-
      - op: add
        path: /spec/roles/0/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
      - op: add
        path: /spec/roles/1/spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: USER
          value: llm-d
